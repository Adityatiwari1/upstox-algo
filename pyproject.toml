[project]
name = "uptox-trading"
version = "0.1.0"
description = "CLI algo trading app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyotp>=2.9.0",
    "playwright>=1.40.0",
    "exchange-calendars>=4.5",
    "protobuf>=4.25",
    "grpcio-tools>=1.60",
    "openpyxl>=3.1.5",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
uptox = "uptox.main:main"
uptox-auth = "uptox.cli.auth_command:main"
uptox-backtest = "uptox.backtest.runner:main"
uptox-replay   = "uptox.backtest.replay_runner:main"
uptox-web      = "uptox.web.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uptox"]
